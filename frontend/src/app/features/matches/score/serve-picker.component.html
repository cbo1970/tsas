<div class="serve-picker" data-testid="serve-picker">
  <h2>Wer schlägt auf?</h2>
  <p>Wähle den Spieler, der das Match mit dem ersten Aufschlag beginnt.</p>
  <button type="button" class="pick-btn" data-testid="serve-pick-1" (click)="picked.emit(1)">
    {{ players().player1 }}
  </button>
  <button type="button" class="pick-btn" data-testid="serve-pick-2" (click)="picked.emit(2)">
    {{ players().player2 }}
  </button>
</div>
